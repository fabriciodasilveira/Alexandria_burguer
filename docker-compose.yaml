services:
  database:
    image: postgres:13-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: restaurante_13mesas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d restaurante_13mesas"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_api
    environment:
      DATABASE_URL: postgresql://user:password@database:5432/restaurante_13mesas
      MAX_TABLES: 13
      TABLE_CAPACITY: 4
      ADMIN_SECRET: "minha_senha_secreta_123"
    ports:
      - "8002:8000"
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_web
    ports:
      - "8081:8081"
    depends_on:
      - backend
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_orchestrator
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: false
      N8N_HOST: n8n
      N8N_SECURE_COOKIE: "false"
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
    
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_API_KEY: "123456"
      WHATSAPP_HOOK_URL: "http://n8n:5678/webhook/e910146d-3636-4f0b-a575-ed9963cd82d9"
      WHATSAPP_HOOK_EVENTS: message
      WAHA_NO_API_KEY: true
      WAHA_DASHBOARD_NO_PASSWORD: true
      WHATSAPP_SWAGGER_NO_PASSWORD: true
      # Configurações críticas para timeout:
      WHATSAPP_STARTUP_TIMEOUT: 60000
      WHATSAPP_SESSION_TIMEOUT: 120
      WHATSAPP_RECONNECT_INTERVAL: 30
      # Configurações do Puppeteer:
      PUPPETEER_LAUNCH_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-accelerated-2d-canvas --no-first-run --no-zygote --disable-gpu"
      # Configurações adicionais:
      WHATSAPP_WEBJS_QR_MAX_RETRIES: 5
      WHATSAPP_WEBJS_RESTART_ON_TIMEOUT: "true"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  whisper:
    image: ghcr.io/ahmetoner/whisper-asr-webservice:latest-cpu
    container_name: whisper_asr
    environment:
      ASR_MODEL: "base"  # Modelo Whisper base (balance entre velocidade e precisão)
      ASR_ENGINE: "openai_whisper"
      ASR_LANGUAGE: "pt"  # Idioma padrão português
      ASR_TASK: "transcribe"
      ASR_DEVICE: "cpu"  # Usa CPU, troque para "cuda" se tiver GPU NVIDIA
    ports:
      - "9000:9000"
    volumes:
      - whisper_models:/root/.cache/whisper  # Cache dos modelos baixados
      - ./audio_files:/audio  # Pasta para áudios a serem processados
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# VOLUMES DEVEM FICAR NO FINAL DO ARQUIVO (fora de services)
volumes:
  postgres_data:
  waha_sessions:
  waha_media:
  n8n_data:
  whisper_models: