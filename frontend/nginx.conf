server {
    # 1. Ouve na porta 80 (dentro do container)
    listen 8081;
    listen [::]:8081;
    
    # 2. Define a raiz para os ficheiros estáticos (o seu index.html)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 3. Serve os ficheiros estáticos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. A MÁGICA (Reverse Proxy)
    # Qualquer chamada para /api/...
    location /api/ {
        # O Nginx fala com o backend pela porta INTERNA (8000)
        # O nome "backend" vem do seu docker-compose.yaml (nome do serviço)
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}