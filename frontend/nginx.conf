server {
    # 1. Ouve na porta 80 (dentro do container)
    listen 80;
    listen [::]:80;
    
    # 2. Define a raiz para os ficheiros estáticos (o seu index.html)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 3. Serve os ficheiros estáticos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. A MÁGICA (Reverse Proxy)
    # Qualquer chamada para /api/...
    location /api/ {
        # ...será reencaminhada para o serviço de backend
        # (usando o nome do container do docker-compose)
        proxy_pass http://backend_api:8002/;

        # Cabeçalhos importantes para o backend saber quem fez a chamada
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}